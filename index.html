<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>볼 점프 (BALL JUMP TOWER)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b0d14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 820px;
      background: #1e2230;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD 상단 바 */
    #hud {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .hud-badge {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      color: #ffd43b;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 2px solid rgba(255, 212, 59, 0.45);
    }

    .sound-btn {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 숫자 위 네모 칸 점수판 및 체력(시간) 게이지 */
    #score-box {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 18, 28, 0.85);
      border: 3px solid #ffd43b;
      border-radius: 16px;
      padding: 8px 20px;
      min-width: 130px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 4;
    }

    #score-display {
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: 1px;
    }

    #health-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    #health-bar-fill {
      width: 100%;
      height: 100%;
      background: #51cf66;
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* 하단 좌/우 컨트롤 버튼 */
    #controls-bar {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      z-index: 6;
      pointer-events: auto;
    }

    .ctrl-btn {
      flex: 1;
      height: 76px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.06s ease, filter 0.06s ease;
    }

    .ctrl-btn:active, .ctrl-btn.pressed {
      transform: scale(0.93);
      filter: brightness(1.18);
    }

    .ctrl-left {
      background: linear-gradient(180deg, #ff6b6b, #e03131);
      border: 3px solid #ffa8a8;
      box-shadow: 0 8px 20px rgba(224, 49, 49, 0.5);
    }

    .ctrl-right {
      background: linear-gradient(180deg, #4dabf7, #1971c2);
      border: 3px solid #a5d8ff;
      box-shadow: 0 8px 20px rgba(25, 113, 194, 0.5);
    }

    .ctrl-label {
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
      opacity: 0.9;
    }

    /* 오버레이 화면 공통 */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 18, 28, 0.94), rgba(26, 31, 48, 0.94));
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* 캣 점프 스타일 로비 */
    .lobby-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .top-icon-btn {
      background: #2b3044;
      border: 2px solid rgba(255, 255, 255, 0.15);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .top-icon-btn:active { transform: scale(0.92); }

    .lobby-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 6px 0;
    }

    .title-logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
      background: linear-gradient(180deg, #fff 20%, #ffd43b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(255, 193, 7, 0.4));
      margin-bottom: 6px;
    }

    .subtitle-badge {
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid #ff6b6b;
      color: #ff8787;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .character-showcase {
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      width: 100%;
      height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .char-preview-ball {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
      animation: floatBall 2s ease-in-out infinite;
    }

    @keyframes floatBall {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .char-name-tag { font-size: 15px; font-weight: 800; color: #e9ecef; }

    .lobby-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .menu-card {
      background: #2b3044;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }
    .menu-card:active { transform: scale(0.94); }
    .menu-card span { font-size: 22px; margin-bottom: 4px; }
    .menu-card label { font-size: 13px; font-weight: 800; color: #ced4da; cursor: pointer; }

    .big-start-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff6b6b, #ff8787);
      border: 3px solid #ffa8a8;
      border-radius: 24px;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
    }
    .big-start-btn:active { transform: scale(0.96); }
    .big-start-btn span { font-size: 26px; }
    .big-start-btn b { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* 모달 공통 */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 18, 28, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      z-index: 20;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title { font-size: 22px; font-weight: 900; }

    #shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }

    .skin-card {
      background: #2b3044;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .skin-card.equipped { border-color: #51cf66; background: rgba(81, 207, 102, 0.15); }

    .skin-preview {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .skin-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .skin-status { font-size: 12px; font-weight: 800; color: #ffd43b; }
    .skin-card.owned .skin-status { color: #adb5bd; }
    .skin-card.equipped .skin-status { color: #51cf66; }

    #ranking-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 16px;
    }

    .rank-item {
      background: #2b3044;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rank-item.top-1 { border-color: #fcc419; background: rgba(252, 196, 25, 0.14); }
    .rank-item.top-2 { border-color: #adb5bd; background: rgba(173, 181, 189, 0.14); }
    .rank-item.top-3 { border-color: #ff922b; background: rgba(255, 146, 43, 0.14); }

    .rank-info { display: flex; align-items: center; gap: 12px; }
    .rank-num { font-size: 16px; font-weight: 900; width: 26px; color: #adb5bd; }
    .rank-name { font-size: 15px; font-weight: 800; color: #fff; }
    .rank-score { font-size: 18px; font-weight: 900; color: #4dabf7; }

    /* 게임오버 화면 (로비로 가기 + 다시 시작하기) */
    .gameover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 18, 28, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      z-index: 15;
    }

    .gameover-stats {
      display: flex;
      gap: 16px;
      margin: 20px 0 32px;
    }

    .stat-box {
      background: #2b3044;
      border: 2px solid rgba(255, 255, 255, 0.1);
      padding: 16px 24px;
      border-radius: 18px;
      text-align: center;
      min-width: 120px;
    }

    .stat-label { font-size: 12px; color: #adb5bd; margin-bottom: 4px; font-weight: 700; }
    .stat-value { font-size: 28px; font-weight: 900; color: #fff; }

    .btn {
      width: 100%;
      max-width: 260px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: linear-gradient(135deg, #ff6b6b, #ff922b); color: #fff; box-shadow: 0 8px 20px rgba(255,107,107,0.4); }
    .btn-secondary { background: #2b3044; color: #fff; border: 2px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div class="hud-badge">🪙 <span id="coin-count">0</span></div>
      <button id="sound-toggle" class="sound-btn" title="사운드 및 배경음악">🔊</button>
    </div>

    <!-- 숫자 위 네모 칸 점수판 + 10초 체력 게이지 바 -->
    <div id="score-box" class="hidden">
      <div id="score-display">0</div>
      <div id="health-bar-container">
        <div id="health-bar-fill"></div>
      </div>
    </div>

    <!-- 하단 좌(빨강) / 우(파랑) 점프 조작 버튼 -->
    <div id="controls-bar" class="hidden">
      <button id="btn-left" class="ctrl-btn ctrl-left">
        <span>◀</span>
        <div class="ctrl-label">왼쪽 점프</div>
      </button>
      <button id="btn-right" class="ctrl-btn ctrl-right">
        <span>▶</span>
        <div class="ctrl-label">오른쪽 점프</div>
      </button>
    </div>

    <!-- 캣 점프 스타일 메인 로비 화면 -->
    <div id="start-screen" class="overlay">
      <div class="lobby-header">
        <button class="top-icon-btn" id="lobby-ranking-btn" title="랭킹보드">🏆</button>
        <div style="font-size: 13px; font-weight: 800; color: #adb5bd;">BALL JUMP TOWER</div>
        <button class="top-icon-btn" id="lobby-sound-btn" title="배경음악/효과음">🎵</button>
      </div>

      <div class="lobby-center">
        <div class="title-logo">BALL JUMP</div>
        <div class="subtitle-badge">🐱 타워 점프 아케이드</div>
      </div>

      <div class="character-showcase">
        <div id="lobby-ball-preview" class="char-preview-ball" style="background:#ff922b; border:3px solid #fff4e6;">⚽</div>
        <div id="lobby-ball-name" class="char-name-tag">클래식 오렌지</div>
        <div style="font-size: 12px; color: #adb5bd; margin-top: 4px;">내 닉네임: <b id="lobby-nickname-text" style="color:#ffd43b;"></b></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
        <div class="lobby-menu-grid">
          <div class="menu-card" id="open-shop-btn">
            <span>🎨</span>
            <label>스킨상점</label>
          </div>
          <div class="menu-card" id="open-ranking-btn">
            <span>🌍</span>
            <label>랭킹보드</label>
          </div>
          <div class="menu-card" id="nickname-change-btn">
            <span>✏️</span>
            <label>닉네임</label>
          </div>
        </div>

        <button id="start-btn" class="big-start-btn">
          <span>🐾</span>
          <b>게임 시작</b>
        </button>
      </div>
    </div>

    <!-- 스킨 상점 모달 -->
    <div id="shop-screen" class="modal-overlay hidden">
      <div class="modal-header">
        <div class="modal-title">🎨 볼 스킨 상점</div>
        <button class="top-icon-btn" id="shop-back-btn">✕</button>
      </div>
      <div id="shop-grid"></div>
    </div>

    <!-- 모두가 똑같이 보는 공용 실시간 랭킹 보드 모달 -->
    <div id="ranking-screen" class="modal-overlay hidden">
      <div class="modal-header">
        <div class="modal-title">🏆 실시간 랭킹 보드</div>
        <button class="top-icon-btn" id="ranking-back-btn">✕</button>
      </div>
      <div style="font-size: 12px; color: #51cf66; margin-bottom: 10px; text-align: center; font-weight: 700;">
        전 세계 모든 플레이어가 동일하게 공유하는 실시간 랭킹입니다[span_0](start_span)[span_0](end_span)!
      </div>
      <div id="ranking-list"></div>
    </div>

    <!-- 게임 오버 화면 (다시 시작하기 + 로비로 가기) -->
    <div id="gameover-screen" class="gameover-overlay hidden">
      <h2 style="font-size: 36px; font-weight: 900; color: #ff6b6b; margin-bottom: 4px;">GAME OVER</h2>
      <p style="font-size: 13px; color: #51cf66; font-weight: 700;" id="rank-submit-status">실시간 랭킹 동기화 완료!</p>
      
      <div class="gameover-stats">
        <div class="stat-box">
          <div class="stat-label">이번 기록</div>
          <div class="stat-value" id="final-score">0m</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">최고 기록</div>
          <div class="stat-value" style="color: #fcc419;" id="final-best">0m</div>
        </div>
      </div>

      <button id="restart-btn" class="btn btn-primary">🔄 다시 시작하기</button>
      <button id="home-btn" class="btn btn-secondary">🏠 로비로 가기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 게임 설정 및 스킨 데이터 (스킨별 특색 효과음 포함)
    // ==========================================
    const GAME_CONFIG = {
      wallMargin: 12,
      ballRadius: 15,
      gravity: 0.44,
      jumpForce: -10.8,
      moveSpeed: 5.2,
      platformHeight: 15,
      maxHealthTime: 10.0 // 체력 바 유지 시간 (10초)
    };

    const SKINS = [
      { id: 'classic', name: '클래식 오렌지', price: 0, color: '#ff922b', rim: '#fff4e6', icon: '⚽', soundPitch: 1.0 },
      { id: 'cat', name: '냥이 볼', price: 30, color: '#f8f9fa', rim: '#ff8787', icon: '🐱', soundPitch: 1.25 }, // 고양이 특색 고음
      { id: 'basket', name: '농구공', price: 60, color: '#e8590c', rim: '#212529', icon: '🏀', soundPitch: 0.8 }, // 묵직한 중저음
      { id: 'slime', name: '민트 슬라임', price: 100, color: '#20c997', rim: '#e6fcf5', icon: '💧', soundPitch: 1.5 }, // 물방울 고음
      { id: 'neon', name: '사이버 네온', price: 150, color: '#7950f2', rim: '#00f5d4', icon: '⚡', soundPitch: 1.35 }, // 네온 일렉톤
      { id: 'gold', name: '황금 마스터', price: 250, color: '#fcc419', rim: '#fff9db', icon: '👑', soundPitch: 1.1 } // 황금 영롱함
    ];

    // ==========================================
    // 2. 로컬 저장소 (나갔다 들어와도 유지)
    // ==========================================
    let saveData = JSON.parse(localStorage.getItem('ballJumpTower_v4')) || {
      playerId: 'player_' + Math.random().toString(36).substring(2, 10),
      bestScore: 0,
      coins: 0,
      ownedSkins: ['classic'],
      equippedSkin: 'classic',
      nickname: '점프왕' + Math.floor(Math.random() * 900 + 100)
    };

    if (!saveData.playerId) {
      saveData.playerId = 'player_' + Math.random().toString(36).substring(2, 10);
    }

    function persistSave() {
      localStorage.setItem('ballJumpTower_v4', JSON.stringify(saveData));
      updateLobbyDisplay();
    }

    // ==========================================
    // 3. 사운드 및 스킨별 특색 효과음 엔진
    // ==========================================
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let bgmInterval = null;
    let bgmStep = 0;

    const BGM_NOTES = [
      523.25, 0, 659.25, 783.99, 659.25, 0, 523.25, 587.33,
      659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 523.25, 0
    ];

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startBGM() {
      if (bgmInterval) return;
      bgmStep = 0;
      bgmInterval = setInterval(() => {
        if (!soundEnabled || gameState !== 'PLAYING') return;
        ensureAudio();
        const freq = BGM_NOTES[bgmStep % BGM_NOTES.length];
        bgmStep++;
        if (freq > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        }
      }, 170);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      ensureAudio();

      const currentSkin = SKINS.find(s => s.id === saveData.equippedSkin) || SKINS[0];
      const pitch = currentSkin.soundPitch || 1.0;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(740 * pitch, now + 0.11);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'land') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(400 * pitch, now + 0.06);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.06);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(55, now + 0.42);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.44);
        osc.start(now);
        osc.stop(now + 0.44);
      } else if (type === 'click') {
        // 버튼 누를 때마다 나는 클릭 효과음
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    // ==========================================
    // 4. 모두가 똑같이 보는 공용 실시간 랭킹 보드 서버
    // ==========================================
    const SHARED_RANK_URL = 'https://kvdb.io/A5k9mP2xQ8vL3nR7wY4zT1/balljump_global_ranks';

    async function syncAndLoadLeaderboard(autoRegister = true) {
      const listEl = document.getElementById('ranking-list');
      if (listEl) {
        listEl.innerHTML = '<div style="text-align:center; color:#adb5bd; margin-top:40px;">실시간 랭킹 동기화 중...</div>';
      }

      let board = [];
      try {
        const res = await fetch(SHARED_RANK_URL, { cache: 'no-store' });
        if (res.ok) {
          const parsed = await res.json();
          if (Array.isArray(parsed)) board = parsed;
        }
      } catch (e) {
        console.warn('랭킹 서버 동기화 대기 중');
      }

      if (autoRegister) {
        const existingIdx = board.findIndex(item => item.id === saveData.playerId);
        if (existingIdx >= 0) {
          board[existingIdx].name = saveData.nickname;
          if (saveData.bestScore > board[existingIdx].score) {
            board[existingIdx].score = saveData.bestScore;
          }
        } else {
          board.push({
            id: saveData.playerId,
            name: saveData.nickname,
            score: saveData.bestScore
          });
        }

        board.sort((a, b) => b.score - a.score);
        board = board.slice(0, 50);

        try {
          await fetch(SHARED_RANK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(board)
          });
        } catch (e) {}
      }

      renderRankingList(board);
    }

    function renderRankingList(board) {
      const listEl = document.getElementById('ranking-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      if (!board || board.length === 0) {
        board = [{ id: saveData.playerId, name: saveData.nickname, score: saveData.bestScore }];
      }

      board.forEach((item, index) => {
        const rank = index + 1;
        const topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const isMe = item.id === saveData.playerId;

        const div = document.createElement('div');
        div.className = `rank-item ${topClass}`;
        div.innerHTML = `
          <div class="rank-info">
            <div class="rank-num">${medal}</div>
            <div class="rank-name">${escapeHtml(item.name || '익명')} ${isMe ? '<span style="color:#ffd43b; font-size:12px;">(나)</span>' : ''}</div>
          </div>
          <div class="rank-score">${item.score}m</div>
        `;
        listEl.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // ==========================================
    // 5. 캔버스 및 게임 변수
    // ==========================================
    const wrapper = document.getElementById('game-wrapper');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;

    function resizeCanvas() {
      width = wrapper.clientWidth || 360;
      height = wrapper.clientHeight || 640;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameState = 'MENU';
    let score = 0;
    let cameraY = 0;
    let highestPlatformY = 0;
    let floorCount = 0;
    let shakeTime = 0;
    let lastTime = 0;

    // 체력 및 1초 쿨타임 점프 변수
    let healthTimeLeft = GAME_CONFIG.maxHealthTime;
    let lastJumpTime = 0;

    const ball = {
      x: 0, y: 0, vx: 0, vy: 0,
      rotation: 0, squashX: 1, squashY: 1, trail: []
    };

    let platforms = [];
    let coins = [];
    let particles = [];

    function updateLobbyDisplay() {
      document.getElementById('coin-count').textContent = saveData.coins;
      document.getElementById('lobby-nickname-text').textContent = saveData.nickname;
      const currentSkin = SKINS.find(s => s.id === saveData.equippedSkin) || SKINS[0];
      const preview = document.getElementById('lobby-ball-preview');
      preview.style.background = currentSkin.color;
      preview.style.borderColor = currentSkin.rim;
      preview.textContent = currentSkin.icon;
      document.getElementById('lobby-ball-name').textContent = currentSkin.name;
    }

    function renderShop() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      SKINS.forEach(skin => {
        const owned = saveData.ownedSkins.includes(skin.id);
        const equipped = saveData.equippedSkin === skin.id;

        const card = document.createElement('div');
        card.className = `skin-card ${owned ? 'owned' : ''} ${equipped ? 'equipped' : ''}`;
        card.innerHTML = `
          <div class="skin-preview" style="background:${skin.color}; border: 3px solid ${skin.rim};">
            ${skin.icon}
          </div>
          <div class="skin-name">${skin.name}</div>
          <div class="skin-status">
            ${equipped ? '✔ 장착중' : owned ? '선택하기' : `🪙 ${skin.price}`}
          </div>
        `;

        card.addEventListener('click', () => {
          playSound('click');
          if (owned) {
            saveData.equippedSkin = skin.id;
            persistSave();
            renderShop();
          } else if (saveData.coins >= skin.price) {
            saveData.coins -= skin.price;
            saveData.ownedSkins.push(skin.id);
            saveData.equippedSkin = skin.id;
            persistSave();
            renderShop();
          } else {
            card.style.transform = 'translateX(4px)';
            setTimeout(() => card.style.transform = 'translateX(-4px)', 60);
            setTimeout(() => card.style.transform = 'none', 120);
          }
        });
        grid.appendChild(card);
      });
    }

    function spawnParticles(x, y, color, count = 8) {
      if (particles.length > 80) particles.splice(0, 20);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.03 + Math.random() * 0.02,
          size: 3 + Math.random() * 3.5,
          color
        });
      }
    }

    // ==========================================
    // 6. 층별 블록 생성 (블록 작게, 많게, 갈수록 적게/좁게)
    // ==========================================
    function generateNextFloor() {
      floorCount++;
      const stepY = 88;
      highestPlatformY -= stepY;

      // 갈수록 블록 폭이 점점 짧아지도록 설계
      const minW = Math.max(48, 92 - Math.floor(floorCount * 0.6));
      const maxW = Math.max(70, 130 - Math.floor(floorCount * 0.6));
      const platW = minW + Math.random() * (maxW - minW);

      const minX = GAME_CONFIG.wallMargin + 6;
      const maxX = Math.max(minX + 10, width - GAME_CONFIG.wallMargin - 6 - platW);
      const platX = minX + Math.random() * (maxX - minX);

      // 10층 이상부터 움직이는 발판 추가
      const isMoving = floorCount >= 10 && Math.random() < 0.3;
      const vx = isMoving ? (Math.random() < 0.5 ? 1 : -1) * (1.3 + Math.random() * 1.2) : 0;

      platforms.push({
        x: platX,
        y: highestPlatformY,
        w: platW,
        h: GAME_CONFIG.platformHeight,
        vx: vx,
        floor: floorCount
      });

      // 코인 생성
      if (Math.random() < 0.45) {
        coins.push({
          x: platX + platW / 2,
          y: highestPlatformY - 20,
          radius: 9,
          collected: false,
          bobOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function startGame() {
      resizeCanvas();
      gameState = 'PLAYING';
      score = 0;
      cameraY = 0;
      floorCount = 0;
      shakeTime = 0;
      lastTime = performance.now();
      healthTimeLeft = GAME_CONFIG.maxHealthTime;
      lastJumpTime = 0;

      platforms = [];
      coins = [];
      particles = [];

      const baseFloorY = height - 150;
      platforms.push({
        x: GAME_CONFIG.wallMargin + 6,
        y: baseFloorY,
        w: width - (GAME_CONFIG.wallMargin + 6) * 2,
        h: 20,
        vx: 0,
        floor: 0
      });

      ball.x = width / 2;
      ball.y = baseFloorY - GAME_CONFIG.ballRadius;
      ball.vx = 0;
      ball.vy = GAME_CONFIG.jumpForce;
      ball.rotation = 0;
      ball.squashX = 1;
      ball.squashY = 1;
      ball.trail = [];

      highestPlatformY = baseFloorY;
      // 초반에 발판을 많이 생성
      for (let i = 0; i < 18; i++) {
        generateNextFloor();
      }

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('shop-screen').classList.add('hidden');
      document.getElementById('ranking-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('score-box').classList.remove('hidden');
      document.getElementById('controls-bar').classList.remove('hidden');
      document.getElementById('score-display').textContent = '0';

      playSound('jump');
      startBGM();
    }

    // 1초(1000ms)에 1번만 점프 뛸 수 있는 쿨타임 제한
    function jumpDirection(dir) {
      if (gameState !== 'PLAYING') return;
      const now = performance.now();
      if (now - lastJumpTime < 1000) return; // 1초 쿨타임

      lastJumpTime = now;
      ensureAudio();
      ball.vx = dir * GAME_CONFIG.moveSpeed;
      ball.vy = GAME_CONFIG.jumpForce;
      ball.squashX = 0.74;
      ball.squashY = 1.28;
      playSound('jump');

      const particleColor = dir < 0 ? '#ff8787' : '#74c0fc';
      spawnParticles(ball.x, ball.y + GAME_CONFIG.ballRadius, particleColor, 6);
    }

    function triggerGameOver() {
      if (gameState === 'GAMEOVER') return;
      gameState = 'GAMEOVER';
      stopBGM();
      shakeTime = 14;
      playSound('gameover');

      const currentSkin = SKINS.find(s => s.id === saveData.equippedSkin) || SKINS[0];
      spawnParticles(ball.x, ball.y, currentSkin.color, 24);

      if (score > saveData.bestScore) {
        saveData.bestScore = score;
      }
      persistSave();
      syncAndLoadLeaderboard(true);

      setTimeout(() => {
        document.getElementById('score-box').classList.add('hidden');
        document.getElementById('controls-bar').classList.add('hidden');
        document.getElementById('final-score').textContent = `${score}m`;
        document.getElementById('final-best').textContent = `${saveData.bestScore}m`;
        document.getElementById('gameover-screen').classList.remove('hidden');
      }, 420);
    }

    function getThemeColors() {
      if (score < 40) return { top: '#1e2749', bottom: '#273469', plat: '#ffd43b', platBorder: '#f08c00' };
      if (score < 100) return { top: '#2b2d42', bottom: '#3a506b', plat: '#4dabf7', platBorder: '#1864ab' };
      if (score < 180) return { top: '#3c1642', bottom: '#6a040f', plat: '#ff8787', platBorder: '#c92a2a' };
      return { top: '#0b090a', bottom: '#240046', plat: '#51cf66', platBorder: '#2b8a3e' };
    }

    // ==========================================
    // 7. 업데이트 및 체력(10초) 타이머 루프
    // ==========================================
    function update(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shakeTime > 0) shakeTime--;
      if (gameState !== 'PLAYING') return;

      // 10초 체력 감소 타이머
      healthTimeLeft -= (dt / 60);
      const healthPct = Math.max(0, (healthTimeLeft / GAME_CONFIG.maxHealthTime) * 100);
      const healthFill = document.getElementById('health-bar-fill');
      healthFill.style.width = healthPct + '%';
      if (healthPct > 50) healthFill.style.background = '#51cf66';
      else if (healthPct > 20) healthFill.style.background = '#fcc419';
      else healthFill.style.background = '#ff6b6b';

      if (healthTimeLeft <= 0) {
        triggerGameOver();
        return;
      }

      const prevY = ball.y;

      ball.vy += GAME_CONFIG.gravity * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= Math.pow(0.96, dt);
      ball.rotation += ball.vx * 0.04 * dt;

      ball.squashX += (1 - ball.squashX) * 0.2;
      ball.squashY += (1 - ball.squashY) * 0.2;

      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      const leftBound = GAME_CONFIG.wallMargin + GAME_CONFIG.ballRadius;
      const rightBound = width - GAME_CONFIG.wallMargin - GAME_CONFIG.ballRadius;
      if (ball.x < leftBound) {
        ball.x = leftBound;
        ball.vx = Math.abs(ball.vx) * 0.65;
      } else if (ball.x > rightBound) {
        ball.x = rightBound;
        ball.vx = -Math.abs(ball.vx) * 0.65;
      }

      // 발판 충돌 및 코인 먹을 때마다 체력 3초 회복!
      for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        if (p.vx !== 0) {
          p.x += p.vx * dt;
          if (p.x <= GAME_CONFIG.wallMargin + 4 || p.x + p.w >= width - GAME_CONFIG.wallMargin - 4) {
            p.vx *= -1;
          }
        }

        if (ball.vy > 0) {
          const prevBottom = prevY + GAME_CONFIG.ballRadius;
          const currBottom = ball.y + GAME_CONFIG.ballRadius;
          if (
            prevBottom <= p.y + 10 &&
            currBottom >= p.y &&
            ball.x + GAME_CONFIG.ballRadius * 0.7 >= p.x &&
            ball.x - GAME_CONFIG.ballRadius * 0.7 <= p.x + p.w
          ) {
            ball.y = p.y - GAME_CONFIG.ballRadius;
            ball.vy = GAME_CONFIG.jumpForce * 0.95;
            ball.squashX = 1.3;
            ball.squashY = 0.72;
            playSound('land');
            spawnParticles(ball.x, p.y, '#ffd43b', 5);
          }
        }

        if (p.y - cameraY > height + 120) {
          platforms.splice(i, 1);
        }
      }

      const targetCamY = ball.y - height * 0.45;
      if (targetCamY < cameraY) {
        cameraY = targetCamY;
      }

      const startY = height - 150;
      const currentAlt = Math.max(0, Math.floor((startY - ball.y) / 22));
      if (currentAlt > score) {
        score = currentAlt;
        document.getElementById('score-display').textContent = score;
      }

      let safetyGuard = 0;
      while (highestPlatformY > cameraY - 250 && safetyGuard < 15) {
        generateNextFloor();
        safetyGuard++;
      }

      if (ball.y - cameraY > height + 40) {
        triggerGameOver();
        return;
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.bobOffset += 0.08 * dt;
        if (c.y - cameraY > height + 80) {
          coins.splice(i, 1);
          continue;
        }
        if (!c.collected && Math.hypot(ball.x - c.x, ball.y - c.y) < GAME_CONFIG.ballRadius + c.radius + 6) {
          c.collected = true;
          saveData.coins += 1;
          // 코인을 먹으면 체력 3초 즉시 회복!
          healthTimeLeft = Math.min(GAME_CONFIG.maxHealthTime, healthTimeLeft + 3.0);
          persistSave();
          playSound('coin');
          spawnParticles(c.x, c.y, '#ffd43b', 8);
          coins.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
      }

      const theme = getThemeColors();
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, theme.top);
      bgGrad.addColorStop(1, theme.bottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(0, 0, GAME_CONFIG.wallMargin, height);
      ctx.fillRect(width - GAME_CONFIG.wallMargin, 0, GAME_CONFIG.wallMargin, height);

      ctx.save();
      ctx.translate(0, -cameraY);

      platforms.forEach(p => {
        ctx.fillStyle = theme.plat;
        ctx.strokeStyle = theme.platBorder;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(p.x + 4, p.y + 2, Math.max(0, p.w - 8), 3);
      });

      coins.forEach(c => {
        const bobY = c.y + Math.sin(c.bobOffset) * 4;
        ctx.beginPath();
        ctx.arc(c.x, bobY, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd43b';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#f08c00';
        ctx.stroke();
      });

      if (gameState !== 'GAMEOVER') {
        const currentSkin = SKINS.find(s => s.id === saveData.equippedSkin) || SKINS[0];
        ball.trail.forEach((pos, idx) => {
          const ratio = (idx + 1) / ball.trail.length;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, GAME_CONFIG.ballRadius * ratio * 0.72, 0, Math.PI * 2);
          ctx.fillStyle = currentSkin.color;
          ctx.globalAlpha = ratio * 0.25;
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.scale(ball.squashX, ball.squashY);
        ctx.rotate(ball.rotation);
        ctx.beginPath();
        ctx.arc(0, 0, GAME_CONFIG.ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = currentSkin.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = currentSkin.rim;
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentSkin.icon, 0, 1);
        ctx.restore();
      }

      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.restore();
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 16.667, 2.0);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ==========================================
    // 8. 이벤트 및 버튼 리스너 연결
    // ==========================================
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    btnLeft.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      jumpDirection(-1);
    });

    btnRight.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      jumpDirection(1);
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      playSound('click');
      startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      playSound('click');
      startGame();
    });

    document.getElementById('home-btn').addEventListener('click', () => {
      playSound('click');
      gameState = 'MENU';
      stopBGM();
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      updateLobbyDisplay();
    });

    document.getElementById('open-shop-btn').addEventListener('click', () => {
      playSound('click');
      renderShop();
      document.getElementById('shop-screen').classList.remove('hidden');
    });
    document.getElementById('shop-back-btn').addEventListener('click', () => {
      playSound('click');
      document.getElementById('shop-screen').classList.add('hidden');
    });

    function openRankingModal() {
      playSound('click');
      document.getElementById('ranking-screen').classList.remove('hidden');
      syncAndLoadLeaderboard(true);
    }

    document.getElementById('open-ranking-btn').addEventListener('click', openRankingModal);
    document.getElementById('lobby-ranking-btn').addEventListener('click', openRankingModal);
    document.getElementById('ranking-back-btn').addEventListener('click', () => {
      playSound('click');
      document.getElementById('ranking-screen').classList.add('hidden');
    });

    document.getElementById('nickname-change-btn').addEventListener('click', () => {
      playSound('click');
      const newName = prompt('랭킹에 표시할 닉네임을 입력하세요 (최대 10자):', saveData.nickname);
      if (newName && newName.trim()) {
        saveData.nickname = newName.trim().substring(0, 10);
        persistSave();
        syncAndLoadLeaderboard(true);
      }
    });

    function toggleAudioState() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled && gameState === 'PLAYING') startBGM();
      else if (!soundEnabled) stopBGM();
    }

    document.getElementById('sound-toggle').addEventListener('click', e => {
      e.stopPropagation();
      toggleAudioState();
    });

    document.getElementById('lobby-sound-btn').addEventListener('click', () => {
      toggleAudioState();
      playSound('coin');
    });

    // 접속 시 즉시 로비 갱신 및 실시간 공용 랭킹 동기화
    updateLobbyDisplay();
    syncAndLoadLeaderboard(true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
